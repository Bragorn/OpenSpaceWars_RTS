<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpaceWars Sandbox</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ui.css">
    <style>
        #sb-panel {
            position: fixed; top: 6px; left: 6px; width: 236px; z-index: 100;
            background: #000; border: 1px solid #3b4048; padding: 9px;
            display: flex; flex-direction: column; gap: 6px;
            max-height: calc(100vh - 12px); overflow-y: auto;
        }
        .sb-row { display: flex; gap: 3px; }
        .sb-lab { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .sb-slider input { width: 100%; }
        .sb-check { display: flex; align-items: center; gap: 6px; }
        #sb-read { border-top: 1px solid #3b4048; padding-top: 6px; white-space: pre; line-height: 12px; min-height: 60px; }
        #sb-title { letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <div id="sb-panel">
        <div id="sb-title">PHYSICS SANDBOX</div>

        <div class="sb-row">
            <button id="b-ab" class="menu-btn">A &gt; B</button>
            <button id="b-ba" class="menu-btn">B &gt; A</button>
        </div>
        <div class="sb-row">
            <button id="b-5" class="menu-btn">5 x A &gt; B</button>
            <button id="b-clear" class="menu-btn btn-secondary">CLEAR</button>
        </div>
        <div class="sb-row">
            <button id="b-pause" class="menu-btn btn-secondary">PAUSE</button>
            <button id="b-step" class="menu-btn btn-secondary">STEP 0.1s</button>
        </div>
        <div class="sb-row">
            <button id="b-report" class="menu-btn btn-secondary">REPORT (LAST SHIP)</button>
        </div>

        <div id="sb-sliders"></div>

        <div>
            <div class="sb-lab"><span>ORBIT DIRECTION</span></div>
            <select class="menu-select" data-key="dir">
                <option value="random">RANDOM</option>
                <option value="cw">CLOCKWISE (SCREEN)</option>
                <option value="ccw">COUNTER-CLOCKWISE</option>
            </select>
        </div>
        <div>
            <div class="sb-lab"><span>PREDICTION GRAVITY</span></div>
            <select class="menu-select" data-key="model">
                <option value="both">BOTH PLANETS, ANY RANGE</option>
                <option value="soi">ONE PLANET, INSIDE SOI</option>
            </select>
        </div>

        <label class="sb-check"><input type="checkbox" data-key="randomR"> RANDOM ORBIT RADIUS</label>
        <label class="sb-check"><input type="checkbox" data-key="showPred"> SHOW PREDICTED PATH</label>
        <label class="sb-check"><input type="checkbox" data-key="showSOI"> SHOW SOI CIRCLES</label>
        <label class="sb-check"><input type="checkbox" data-key="showTrails"> SHOW TRAILS</label>

        <div id="sb-read">NO SHIP</div>
    </div>

    <textarea id="sb-report" readonly style="display:none; position:fixed; right:6px; top:6px; width:460px; height:70vh; z-index:101; background:#000; color:#fff; border:1px solid #3b4048; user-select:text; -webkit-user-select:text; resize:both;"></textarea>

    <script src="js/data/config.js"></script>
    <script src="js/data/Factions.js"></script>
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>
    <script src="js/render/Viewport.js"></script>
    <script src="js/render/Renderer.js"></script>
    <script src="js/core/GameManager.js"></script>

    <script>
    (() => {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const SOI = (typeof TRANSIT_SOI_RADIUS !== 'undefined') ? TRANSIT_SOI_RADIUS : 110;
        const STEP = 1 / 60;

        // ---- Minimal world: two friendly planets, no AI, no auto-spawning ----
        const gm = new GameManager(false);
        gm.setFactionMap('REMNANTS', 'PROTOCOL');
        gm.isRunning = true;
        gm.checkWinCondition = () => {};

        const planetA = new Planet(0, 0, 3, 1);
        const planetB = new Planet(0, 0, 3, 1);
        [planetA, planetB].forEach(p => { p.update = () => {}; });
        gm.planets = [planetA, planetB];

        const base = FACTION_DATA.REMNANTS;
        const vals = {
            mu: 30000,
            speed: base.maxSpeed || 30,
            power: base.enginePower || 14,
            sep: 400,
            radius: 50,
            scale: 1,
            horizon: 10,
            dir: 'random',
            model: 'both',
            randomR: false,
            showPred: true,
            showSOI: true,
            showTrails: true
        };

        const sliderDefs = [
            { id: 'mu',      label: 'GRAVITY',       min: 5000, max: 80000, step: 1000 },
            { id: 'speed',   label: 'CRUISE SPEED',  min: 10,   max: 90,    step: 1 },
            { id: 'power',   label: 'ENGINE POWER',  min: 4,    max: 120,   step: 1 },
            { id: 'sep',     label: 'PLANET GAP',    min: 200,  max: 1000,  step: 10 },
            { id: 'radius',  label: 'ORBIT RADIUS',  min: 40,   max: 80,    step: 1 },
            { id: 'scale',   label: 'TIME SCALE',    min: 0.1,  max: 3,     step: 0.1 },
            { id: 'horizon', label: 'PREDICT SECS',  min: 2,    max: 20,    step: 1 }
        ];

        function applyFactionStats() {
            base.maxSpeed = vals.speed;
            base.enginePower = vals.power;
        }

        function layout() {
            planetA.x = 640 - vals.sep / 2; planetA.y = 360;
            planetB.x = 640 + vals.sep / 2; planetB.y = 360;
        }

        function onValueChange(id) {
            if (id === 'speed' || id === 'power') applyFactionStats();
            if (id === 'sep') layout();
        }

        // ---- UI wiring ----
        const sliderBox = document.getElementById('sb-sliders');
        sliderDefs.forEach(def => {
            const row = document.createElement('div');
            row.className = 'sb-slider';
            row.innerHTML =
                `<div class="sb-lab"><span>${def.label}</span><span class="val"></span></div>` +
                `<input type="range" min="${def.min}" max="${def.max}" step="${def.step}">`;
            sliderBox.appendChild(row);
            const input = row.querySelector('input');
            const out = row.querySelector('.val');
            input.value = vals[def.id];
            out.textContent = vals[def.id];
            input.addEventListener('input', () => {
                vals[def.id] = parseFloat(input.value);
                out.textContent = vals[def.id];
                onValueChange(def.id);
            });
        });

        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            if (el.type === 'checkbox') el.checked = !!vals[key]; else el.value = vals[key];
            el.addEventListener('change', () => {
                vals[key] = (el.type === 'checkbox') ? el.checked : el.value;
            });
        });

        // ---- Sim state ----
        const trails = new Map();
        let paused = false;
        let accumulator = 0;
        let simTime = 0;
        let tickCount = 0;
        let lastTime = performance.now();
        let lastShip = null;
        const queued = [];

        function launch(from, to) {
            const s = gm.spawnShip(from, to);
            if (!s) return;
            s.gravConst = vals.mu;
            if (vals.dir !== 'random') s.orbitDir = (vals.dir === 'cw') ? 1 : -1;
            if (!vals.randomR) s.targetOrbitRadius = vals.radius;
            lastShip = s;
            startRecord(s, from, to);
        }

        function clearShips() {
            gm.ships = [];
            trails.clear();
            queued.length = 0;
            lastShip = null;
            records.length = 0;
        }

        function tickOnce() {
            simTime += STEP;
            while (queued.length && queued[0].t <= simTime) {
                const q = queued.shift();
                launch(q.from, q.to);
            }
            gm.step(STEP);
            for (const rec of records) observe(rec);
            tickCount++;

            if (tickCount % 3 === 0) {
                for (const s of gm.ships) {
                    if (s.state === 'orbit') continue;
                    let t = trails.get(s);
                    if (!t) { t = { pts: [], color: s.color }; trails.set(s, t); }
                    t.pts.push(s.x, s.y);
                    if (t.pts.length > 1600) t.pts.splice(0, 2);
                }
            }
        }

        document.getElementById('b-ab').onclick = () => launch(planetA, planetB);
        document.getElementById('b-ba').onclick = () => launch(planetB, planetA);
        document.getElementById('b-5').onclick = () => {
            for (let i = 0; i < 5; i++) queued.push({ t: simTime + i * 0.4, from: planetA, to: planetB });
        };
        document.getElementById('b-clear').onclick = clearShips;
        const pauseBtn = document.getElementById('b-pause');
        function togglePause() {
            paused = !paused;
            pauseBtn.textContent = paused ? 'PLAY' : 'PAUSE';
        }
        pauseBtn.onclick = togglePause;
        document.getElementById('b-step').onclick = () => { for (let i = 0; i < 6; i++) tickOnce(); };
        window.addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); togglePause(); } });

        // ---- Flight recorder: watches ships from outside, so it works with any Ship.js ----
        const records = [];
        let shipCounter = 0;
        const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
        const deg = (r) => (r * 180 / Math.PI).toFixed(0);

        function nearestPlanet(x, y) {
            let best = gm.planets[0], bd = Infinity;
            for (const p of gm.planets) {
                const d = Math.hypot(x - p.x, y - p.y);
                if (d < bd) { bd = d; best = p; }
            }
            return { p: best, d: bd, name: best === planetA ? 'A' : 'B' };
        }

        function startRecord(ship, from, to) {
            records.push({
                id: ++shipCounter, ship,
                from: from === planetA ? 'A' : 'B', to: to === planetA ? 'A' : 'B',
                dir: ship.orbitDir, r: ship.targetOrbitRadius, mu: ship.gravConst,
                speed: vals.speed, power: vals.power, gap: vals.sep, model: vals.model,
                t: 0, nextSample: 0, lastState: ship.state, done: false,
                dvTotal: 0, burnTime: 0,
                events: [], burns: [], samples: [], burn: null, final: null
            });
            if (records.length > 12) records.shift();
        }

        function closeBurn(rec) {
            const b = rec.burn;
            rec.burn = null;
            const s = rec.ship;
            const avgVel = b.sumVel / Math.max(1, b.n);
            const avgRad = b.sumRad / Math.max(1, b.n);
            const type = avgVel < 0.61 ? 'PROGRADE' : (avgVel > 2.53 ? 'RETROGRADE' : 'SIDEWAYS');

            const t = s.targetPlanet;
            const pred = predict(s, 14);
            const L = (pred.minX - t.x) * pred.minVy - (pred.minY - t.y) * pred.minVx;
            const sense = L > 0 ? 'CW' : 'CCW';
            const depSense = rec.dir > 0 ? 'CW' : 'CCW';

            const flags = [];
            if (b.state === 'moving') flags.push('MID-FLIGHT');
            if (avgRad < 0.52) flags.push('AWAY-FROM-PLANET');

            rec.dvTotal += b.dv;
            rec.burnTime += (b.t1 - b.t0);
            rec.burns.push(
                `#${rec.burns.length + 1} ${b.t0.toFixed(1)}-${b.t1.toFixed(1)}s (${(b.t1 - b.t0).toFixed(2)}s) ${type} ` +
                `near ${b.near} ${b.d0.toFixed(0)}>${b.d1.toFixed(0)}px  dv ${b.dv.toFixed(1)}  ` +
                `heading vs velocity ${deg(avgVel)}deg, vs outward ${deg(avgRad)}deg` +
                (flags.length ? '  <' + flags.join(',') + '>' : '') + '\n' +
                `     after burn: pred closest to target ${pred.minD.toFixed(1)} (err ${(pred.minD - rec.r).toFixed(1)}), ` +
                `arrival ${sense} vs departure ${depSense} = ${sense === depSense ? 'SAME' : 'OPPOSITE'}`
            );
        }

        function observe(rec) {
            if (rec.done) return;
            const s = rec.ship;
            if (!gm.ships.includes(s)) {
                rec.done = true;
                rec.events.push(`${rec.t.toFixed(1)}s  SHIP REMOVED`);
                return;
            }
            rec.t += STEP;
            const sp = Math.hypot(s.vx, s.vy);
            const np = nearestPlanet(s.x, s.y);

            if (s.state !== rec.lastState) {
                rec.events.push(`${rec.t.toFixed(1)}s  ${rec.lastState} > ${s.state}  near ${np.name} ${np.d.toFixed(0)}px  speed ${sp.toFixed(1)}`);
                rec.lastState = s.state;
                if (s.state === 'orbit') {
                    if (rec.burn) closeBurn(rec);
                    rec.final = { planet: np.name, r: np.d, v: sp, vc: Math.sqrt(rec.mu / Math.max(1, np.d)), t: rec.t };
                    rec.done = true;
                    return;
                }
            }

            const burning = s.thrustRatio > 0.02 && s.state !== 'surface_launch' && s.state !== 'landing';
            if (burning) {
                if (!rec.burn) {
                    rec.burn = { t0: rec.t, state: s.state, near: np.name, d0: np.d, d1: np.d, t1: rec.t, gap: 0, n: 0, sumVel: 0, sumRad: 0, dv: 0 };
                }
                const b = rec.burn;
                b.gap = 0;
                b.n++;
                b.t1 = rec.t;
                b.d1 = np.d;
                b.dv += s.enginePower * s.thrustRatio * STEP;
                b.sumVel += Math.abs(wrapAngle(s.heading - Math.atan2(s.vy, s.vx)));
                b.sumRad += Math.abs(wrapAngle(s.heading - Math.atan2(s.y - np.p.y, s.x - np.p.x)));
            } else if (rec.burn) {
                rec.burn.gap++;
                if (rec.burn.gap > 4) closeBurn(rec);
            }

            if (rec.t >= rec.nextSample) {
                rec.nextSample += 1;
                rec.samples.push(
                    `${rec.t.toFixed(1)}s ${s.state} v${sp.toFixed(1)} A${Math.hypot(s.x - planetA.x, s.y - planetA.y).toFixed(0)} ` +
                    `B${Math.hypot(s.x - planetB.x, s.y - planetB.y).toFixed(0)} thrust${(s.thrustRatio * 100).toFixed(0)}%`
                );
            }
        }

        function buildReport(rec) {
            const L = [];
            L.push(`SHIP ${rec.id}  ${rec.from}>${rec.to}  DIR ${rec.dir > 0 ? 'CW' : 'CCW'}  ORBIT R ${rec.r.toFixed(1)}`);
            L.push(`MU ${rec.mu}  CRUISE ${rec.speed}  POWER ${rec.power}  GAP ${rec.gap}  PRED MODEL ${rec.model}  SOI ${SOI}`);
            L.push('EVENTS');
            rec.events.forEach(e => L.push('  ' + e));
            L.push('BURNS');
            rec.burns.forEach(b => L.push('  ' + b));
            if (rec.burn) L.push('  (burn in progress)');
            const vc = Math.sqrt(rec.mu / rec.r);
            const ideal = 2 * (Math.sqrt(rec.speed * rec.speed + 2 * rec.mu / rec.r) - vc);
            L.push(`TOTAL ${rec.burns.length} burns, ${rec.burnTime.toFixed(1)}s, dv ${rec.dvTotal.toFixed(1)} (ideal ~${ideal.toFixed(1)})`);
            if (rec.final) {
                L.push(`FINAL orbit around ${rec.final.planet}: r ${rec.final.r.toFixed(1)}, v ${rec.final.v.toFixed(1)} (circular ${rec.final.vc.toFixed(1)}), total ${rec.final.t.toFixed(1)}s`);
            }
            L.push('SAMPLES (1s)');
            rec.samples.forEach(x => L.push('  ' + x));
            return L.join('\n');
        }

        const reportBox = document.getElementById('sb-report');
        document.getElementById('b-report').onclick = () => {
            if (reportBox.style.display === 'block') { reportBox.style.display = 'none'; return; }
            const rec = records[records.length - 1];
            reportBox.value = rec ? buildReport(rec) : 'NO SHIP RECORDED';
            reportBox.style.display = 'block';
            reportBox.select();
            if (navigator.clipboard) navigator.clipboard.writeText(reportBox.value).catch(() => {});
        };

        // ---- Predicted path: ballistic, no thrust, from the ship's current state ----
        function predict(ship, seconds) {
            const target = ship.targetPlanet;
            const planets = gm.planets;
            const mu = ship.gravConst;
            const dt = 1 / 30;
            const steps = Math.round(seconds / dt);
            let x = ship.x, y = ship.y, vx = ship.vx, vy = ship.vy;
            const pts = [x, y];
            let minD = Infinity, minX = x, minY = y, minSpeed = 0, minVx = 0, minVy = 0;

            for (let i = 0; i < steps; i++) {
                let ax = 0, ay = 0;
                for (let k = 0; k < planets.length; k++) {
                    const p = planets[k];
                    const dx = p.x - x, dy = p.y - y;
                    const d2 = Math.max(dx * dx + dy * dy, 1);
                    const d = Math.sqrt(d2);
                    if (vals.model === 'soi' && d > SOI) continue;
                    const a = mu / d2;
                    ax += (dx / d) * a;
                    ay += (dy / d) * a;
                }
                vx += ax * dt; vy += ay * dt;
                x += vx * dt; y += vy * dt;
                pts.push(x, y);

                const td = Math.sqrt((x - target.x) * (x - target.x) + (y - target.y) * (y - target.y));
                if (td < minD) { minD = td; minX = x; minY = y; minSpeed = Math.sqrt(vx * vx + vy * vy); minVx = vx; minVy = vy; }
            }
            return { pts, minD, minX, minY, minSpeed, minVx, minVy };
        }

        function updateReadout(pred) {
            const el = document.getElementById('sb-read');
            const s = lastShip;
            if (!s || !gm.ships.includes(s)) { el.textContent = 'NO SHIP'; return; }

            const sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
            const t = s.targetPlanet;
            const dT = Math.sqrt((s.x - t.x) * (s.x - t.x) + (s.y - t.y) * (s.y - t.y));
            let txt =
                `STATE   ${s.state.toUpperCase()}${s.burning ? ' (BURN)' : ''}\n` +
                `SPEED   ${sp.toFixed(1)}\n` +
                `TARGET  ${dT.toFixed(0)} PX\n` +
                `ORBIT R ${s.targetOrbitRadius.toFixed(1)}   DIR ${s.orbitDir > 0 ? 'CW' : 'CCW'}`;

            if (pred && (s.state === 'moving' || s.state === 'insertion')) {
                txt += `\nPRED CLOSEST ${pred.minD.toFixed(1)}` +
                       `\nERROR        ${(pred.minD - s.targetOrbitRadius).toFixed(1)}` +
                       `\nPRED SPEED   ${pred.minSpeed.toFixed(1)}`;
            }
            if (s.state === 'orbit') {
                const vc = Math.sqrt(s.gravConst / Math.max(1, dT));
                txt += `\nFINAL R ${dT.toFixed(1)}   V ${sp.toFixed(1)}\nCIRCULAR V ${vc.toFixed(1)}`;
            }
            el.textContent = txt;
        }

        // ---- Drawing ----
        function draw() {
            gm.renderer.render(gm, null);

            Viewport.apply(ctx);
            const px = 1 / Viewport.scale;
            ctx.lineWidth = px;

            if (vals.showSOI) {
                ctx.setLineDash([4 * px, 4 * px]);
                ctx.strokeStyle = '#3b4048';
                for (const p of gm.planets) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, SOI, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            if (vals.showTrails) {
                ctx.globalAlpha = 0.5;
                for (const [ship, t] of trails) {
                    if (t.pts.length < 4) continue;
                    ctx.strokeStyle = t.color;
                    ctx.beginPath();
                    ctx.moveTo(t.pts[0], t.pts[1]);
                    for (let i = 2; i < t.pts.length; i += 2) ctx.lineTo(t.pts[i], t.pts[i + 1]);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            let lastPred = null;
            if (vals.showPred) {
                const flying = gm.ships.filter(s =>
                    s.state === 'launching' || s.state === 'moving' || s.state === 'insertion');
                const list = flying.slice(-10);
                if (lastShip && flying.includes(lastShip) && !list.includes(lastShip)) list.push(lastShip);

                ctx.setLineDash([3 * px, 3 * px]);
                for (const s of list) {
                    const r = predict(s, vals.horizon);
                    if (s === lastShip) lastPred = r;
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(r.pts[0], r.pts[1]);
                    for (let i = 2; i < r.pts.length; i += 2) ctx.lineTo(r.pts[i], r.pts[i + 1]);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                ctx.strokeStyle = '#ffffff';
                for (const s of list) {
                    if (s.state === 'launching') continue;
                    const r = (s === lastShip && lastPred) ? lastPred : predict(s, vals.horizon);
                    const c = 3 * px;
                    ctx.beginPath();
                    ctx.moveTo(r.minX - c, r.minY - c); ctx.lineTo(r.minX + c, r.minY + c);
                    ctx.moveTo(r.minX - c, r.minY + c); ctx.lineTo(r.minX + c, r.minY - c);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = `${10 * px}px pinballin-scan, monospace`;
            ctx.textAlign = 'center';
            ctx.fillText('A', planetA.x, planetA.y - planetA.radius - 8 * px);
            ctx.fillText('B', planetB.x, planetB.y - planetB.radius - 8 * px);

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            updateReadout(lastPred);
        }

        function frame(now) {
            const dt = Math.min(0.1, (now - lastTime) / 1000);
            lastTime = now;
            if (!paused) {
                accumulator += dt * vals.scale;
                let n = 0;
                while (accumulator >= STEP && n < 10) { tickOnce(); accumulator -= STEP; n++; }
                if (n >= 10) accumulator = 0;
            }
            draw();
            requestAnimationFrame(frame);
        }

        function resize() { Viewport.update(canvas); }
        window.addEventListener('resize', resize);

        applyFactionStats();
        layout();
        resize();
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
