<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpaceWars</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="game"></canvas>

    <!-- Unified Top Center Command Bar with Exit Menu Dropdown -->
    <div id="hud-top-center" class="hud-top-center hidden">
        <div class="hud-team-card t1" id="hud-card-t1">
            <div class="hud-card-header" id="hud-label-t1">T1 FACTION</div>
            <div class="hud-card-body">
                <span>SHIPS: <b id="hud-val-t1" class="hud-ship-val">0</b></span>
                <span>SPM: <b id="hud-spm-t1">0.0</b></span>
            </div>
            <div id="hud-state-t1" class="hud-ai-state">STATE: IDLE</div>
        </div>

        <div class="hud-center-cluster">
            <div id="game-timer" class="hud-timer">00:00</div>
            <div class="hud-controls">
                <button id="btn-play-pause" class="hud-btn">Pause</button>
                <button id="btn-speed-1" class="hud-btn active">1X</button>
                <button id="btn-speed-2" class="hud-btn">2X</button>
                <button id="btn-speed-3" class="hud-btn">3X</button>
                
                <!-- In-Game Dropdown Menu -->
                <div class="hud-menu-wrapper">
                    <button class="hud-btn" id="btn-ingame-menu">Menu ▾</button>
                    <div class="hud-menu-dropdown">
                        <button class="hud-dropdown-item" id="btn-menu-restart">Change Team</button>
                        <button class="hud-dropdown-item" id="btn-menu-exit">Exit to Main</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="hud-team-card t2" id="hud-card-t2">
            <div class="hud-card-header" id="hud-label-t2">T2 FACTION</div>
            <div class="hud-card-body">
                <span>SHIPS: <b id="hud-val-t2" class="hud-ship-val">0</b></span>
                <span>SPM: <b id="hud-spm-t2">0.0</b></span>
            </div>
            <div id="hud-state-t2" class="hud-ai-state" style="text-align:right;">STATE: IDLE</div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden">
        <h1 id="game-over-title">VICTORY</h1>
        <p id="game-over-msg"></p>
        <button id="btn-restart" class="menu-btn">MAIN MENU</button>
    </div>

    <!-- Batch Simulation Modal -->
    <div id="sim-modal" class="sim-overlay hidden">
        <div class="sim-dialog">
            
            <!-- VIEW 1: SIMULATION SETUP FORM -->
            <div id="sim-setup-view">
                <div class="sim-header">
                    <h2>BATCH SIMULATION CONFIGURATION</h2>
                </div>
                
                <div class="sim-body" style="display: flex; flex-direction: column; gap: 12px; padding: 15px 0;">
                    <div class="sim-form-row" style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="sim-matches-count">Simulations Per Matchup:</label>
                        <input type="number" id="sim-matches-count" value="10" min="1" max="1000" style="width: 70px; text-align: center;" />
                    </div>

                    <div class="sim-form-row" style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="sim-combo-mode">Matchup Selection:</label>
                        <select id="sim-combo-mode" class="menu-select" style="width: 220px;">
                            <option value="ALL">All Faction Combos (Round-Robin)</option>
                            <option value="SPECIFIC">Specific Matchup Choice</option>
                        </select>
                    </div>

                    <!-- Options for Specific Match Choice -->
                    <div id="sim-specific-options" class="hidden" style="display: flex; flex-direction: column; gap: 10px; background: rgba(0, 170, 255, 0.05); padding: 10px; border: 1px solid #00aaff; border-radius: 4px; margin-top: 4px;">
                        <div class="sim-form-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="sim-faction-1">Faction 1 (Team 1):</label>
                            <select id="sim-faction-1" class="menu-select" style="width: 180px;"></select>
                        </div>
                        <div class="sim-form-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="sim-faction-2">Faction 2 (Team 2):</label>
                            <select id="sim-faction-2" class="menu-select" style="width: 180px;"></select>
                        </div>
                        <div class="sim-form-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="sim-map-select">Arena / Map Target:</label>
                            <select id="sim-map-select" class="menu-select" style="width: 180px;">
                                <option value="ALL">All Maps</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="sim-footer" style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
                    <button id="btn-start-sim-run" class="menu-btn btn-primary">START SIMULATION</button>
                    <button id="btn-close-sim" class="menu-btn btn-secondary">CANCEL</button>
                </div>
            </div>

            <!-- VIEW 2: LIVE DASHBOARD & RESULTS -->
            <div id="sim-running-view" class="hidden">
                <div class="sim-header">
                    <h2>HEADLESS BATCH SIMULATION DASHBOARD</h2>
                    <span id="sim-progress" class="sim-progress-badge">0%</span>
                </div>
                <div id="sim-output" class="sim-body">
                    <p class="sim-loading">Ready to simulate...</p>
                </div>
                <div class="sim-footer" style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
                    <button id="btn-sim-reset" class="menu-btn btn-primary">NEW SETUP</button>
                    <button id="btn-close-sim-running" class="menu-btn btn-secondary">CLOSE DASHBOARD</button>
                </div>
            </div>

        </div>
    </div>

    <!-- UI Overlays -->
    <div id="ui-overlay">
        <!-- Title Screen -->
        <div id="menu-main" class="menu-card">
            <h2>OPEN SPACE WARS</h2>
            <button id="btn-main-play" class="menu-btn">ENTER TACTICAL BAY</button>
        </div>

        <!-- Sci-Fi Matchup Setup Screen -->
        <div id="menu-map-select" class="menu-card menu-setup-card" style="display: none;">
            <div class="setup-header-row">
                <h2 class="menu-title">MATCH SETUP</h2>
                <div class="mode-select-box">
                    <label for="select-game-mode">MODE:</label>
                    <select id="select-game-mode" class="menu-select mode-dropdown">
                        <option value="PLAYER_VS_CPU">Player vs CPU</option>
                        <option value="CPU_VS_CPU">Spectator (CPU vs CPU)</option>
                    </select>
                </div>
            </div>

            <div class="matchup-container">
                <!-- Left: Team 1 -->
                <div class="team-panel team-home">
                    <div id="p1-header-label" class="team-header">PLAYER 1</div>
                    <div class="faction-select-group">
                        <label for="select-player-faction">Faction:</label>
                        <select id="select-player-faction" class="menu-select"></select>
                    </div>
                </div>

                <!-- Center: Arena / Map Selector -->
                <div class="matchup-center">
                    <div class="vs-badge">VS</div>
                    <div class="map-select-box">
                        <h3>SELECT ARENA</h3>
                        <div id="slot-buttons" class="slot-buttons-list"></div>
                    </div>
                </div>

                <!-- Right: Team 2 -->
                <div class="team-panel team-away">
                    <div id="p2-header-label" class="team-header">CPU ENEMY</div>
                    <div class="faction-select-group">
                        <label for="select-enemy-faction">Faction:</label>
                        <select id="select-enemy-faction" class="menu-select"></select>
                    </div>
                </div>
            </div>

            <!-- Bottom Action Row -->
            <div class="menu-actions">
                <button id="btn-map-back" class="menu-btn btn-secondary">BACK</button>
                <button id="btn-batch-sim" class="menu-btn btn-sim">SIMULATE ALL MAPS</button>
                <button id="btn-map-start" class="menu-btn btn-primary">LAUNCH MATCH</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT INCLUDES -->
    <script src="js/config.js"></script>
    <script src="js/Factions.js"></script>
    
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>

    <script src="js/systems/Controls.js"></script>
    <script src="js/systems/AIController.js"></script>
    <script src="js/systems/Renderer.js"></script>
    <script src="js/systems/AIDebugRenderer.js"></script>

    <script src="js/MapRegistry.js"></script>
    <script src="js/GameManager.js"></script>

    <script src="js/utils/TelemetryCollector.js"></script>
    <script src="js/utils/BatchSimulator.js"></script>
    
    <script src="js/main.js"></script>
    <script src="js/App.js"></script>
</body>
</html>
