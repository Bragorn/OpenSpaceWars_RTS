<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpaceWars</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="game"></canvas>

    <div id="hud" class="hud-top-left hidden">
        <div id="game-timer" class="hud-timer">00:00</div>
        <div class="hud-controls">
            <button id="btn-play-pause" class="hud-btn active">Pause</button>
            <button id="btn-speed-1" class="hud-btn active">1x</button>
            <button id="btn-speed-2" class="hud-btn">2x</button>
            <button id="btn-speed-3" class="hud-btn">3x</button>
        </div>
    </div>

    <div id="game-over-modal" class="hidden">
        <h1 id="game-over-title">VICTORY</h1>
        <p id="game-over-msg"></p>
        <button id="btn-restart" class="menu-btn">PLAY AGAIN</button>
    </div>

    <div id="ui-overlay">
        <div id="menu-main" class="menu-card">
            <h2>OPEN SPACE WARS</h2>
            <button id="btn-main-play" class="menu-btn">PLAY GAME</button>
        </div>

        <div id="menu-map-select" class="menu-card" style="display: none;">
            <h3>MATCH SETUP</h3>

            <div class="faction-select-container">
                <div class="faction-select-group">
                    <label for="select-player-faction">Player Faction:</label>
                    <select id="select-player-faction" class="menu-select"></select>
                </div>
                <div class="faction-select-group">
                    <label for="select-enemy-faction">Enemy Faction:</label>
                    <select id="select-enemy-faction" class="menu-select"></select>
                </div>
            </div>

            <h3 style="margin-top: 14px;">SELECT MAP</h3>
            <div id="slot-buttons"></div>
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button id="btn-map-back" class="menu-btn btn-secondary" style="flex: 1;">BACK</button>
                <button id="btn-map-start" class="menu-btn" style="flex: 2;">LAUNCH MATCH</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/Factions.js"></script>
    
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>

    <script src="js/systems/Controls.js"></script>
    <script src="js/systems/AIController.js"></script>
    <script src="js/systems/Renderer.js"></script>

    <script src="js/MapRegistry.js"></script>
    <script src="js/GameManager.js"></script>
    <script src="js/main.js"></script>
    <script src="js/App.js"></script>
</body>
</html>
