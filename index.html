<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpaceWars</title>

    <!-- Retro Font: VT323 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Game Canvas -->
    <canvas id="game"></canvas>

    <!-- Top-Left In-Game HUD -->
    <div id="hud" class="hud-top-left hidden">
        <!-- Timer on top -->
        <div id="game-timer" class="hud-timer">00:00</div>

        <!-- Speed & Play/Pause Controls underneath -->
        <div class="hud-controls">
            <button id="btn-play-pause" class="hud-btn active">Pause</button>
            <button id="btn-speed-1" class="hud-btn active">1x</button>
            <button id="btn-speed-2" class="hud-btn">2x</button>
            <button id="btn-speed-3" class="hud-btn">3x</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden">
        <h1 id="game-over-title">VICTORY</h1>
        <p id="game-over-msg"></p>
        <button id="btn-restart" class="menu-btn">PLAY AGAIN</button>
    </div>

    <!-- App Menu & Editor UI Overlay -->
    <div id="ui-overlay">
        <!-- 1. MAIN MENU -->
        <div id="menu-main" class="menu-card">
            <h2>OPEN SPACE WARS</h2>
            <button id="btn-main-play" class="menu-btn">PLAY GAME</button>
            <button id="btn-main-editor" class="menu-btn btn-secondary">MAP EDITOR</button>
        </div>

        <!-- 2. MAP SELECT MENU -->
        <div id="menu-map-select" class="menu-card" style="display: none;">
            <h3>SELECT MAP</h3>
            <div id="slot-buttons"></div>
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button id="btn-map-back" class="menu-btn btn-secondary" style="flex: 1;">BACK</button>
                <button id="btn-map-start" class="menu-btn" style="flex: 2;">PLAY MAP</button>
            </div>
        </div>

        <!-- 3. EDITOR TOOLBAR -->
        <div id="editor-toolbar" style="display: none;">
            <span class="editor-label">SYMMETRY:</span>
            <button id="btn-sym-none" class="editor-btn">ASYMMETRIC</button>
            <button id="btn-sym-mirror" class="editor-btn">MIRROR (H)</button>
            <button id="btn-sym-rot" class="editor-btn">ROTATIONAL</button>

            <span class="editor-label" style="margin-left: 12px;">SAVE TO:</span>
            <select id="editor-save-slot" class="editor-select">
                <option value="1">Slot 1</option>
                <option value="2">Slot 2</option>
                <option value="3">Slot 3</option>
                <option value="4">Slot 4</option>
                <option value="5">Slot 5</option>
            </select>
            <button id="btn-editor-save" class="editor-btn btn-save">SAVE</button>
            <button id="btn-editor-exit" class="editor-btn btn-exit">EXIT</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>

    <script src="js/systems/Controls.js"></script>
    <script src="js/systems/AIController.js"></script>
    <script src="js/systems/Renderer.js"></script>

    <script src="js/MapRegistry.js"></script>
    <script src="js/MapEditor.js"></script>

    <script src="js/GameManager.js"></script>
    <script src="js/main.js"></script>
    <script src="js/App.js"></script>
</body>
</html>
