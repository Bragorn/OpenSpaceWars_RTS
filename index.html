<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpaceWars</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-frame">
        <canvas id="game"></canvas>
    </div>
        <div id="ui-layer">
        <div id="top-bar">
            <div id="timer">00:00</div>
            <div id="speed-controls">
                <button id="btn-pause" class="speed-btn">Pause</button>
                <button id="btn-1x" class="speed-btn active">1x</button>
                <button id="btn-2x" class="speed-btn">2x</button>
                <button id="btn-3x" class="speed-btn">3x</button>
            </div>
        </div>

        <div id="game-over-modal" class="hidden">
            <h1 id="game-over-title">VICTORY!</h1>
            <p id="game-over-msg">You have eliminated the enemy fleet!</p>
            <button id="btn-restart">Play Again</button>
        </div>
    </div>
    <!-- Configuration & Helpers -->
    <script src="js/config.js"></script>

    <!-- Entities -->
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>

    <!-- Systems & Managers -->
    <script src="js/systems/Controls.js"></script>
    <script src="js/systems/AIController.js"></script>
    <script src="js/systems/Renderer.js"></script>
    <script src="js/GameManager.js"></script>

    <!-- Entry Point -->
    <script src="js/main.js"></script>
</body>
</html>
